# Optional GitHub Actions workflow. Copy it to .github/workflows/installer-native.yml to enable it; see CONTRIBUTING.md.
name: Windows native installer acceptance

on:
  push:
    branches: [main, 'codex/installer-acceptance-*']
    paths:
      - 'windows/installer/**'
      - '.github/workflows/installer-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    # Keep manual replays on acceptance branches; main only gets path-filtered pushes.
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/installer-acceptance-'))
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # Redirected environment variables do not create a separate Windows account or HKCU hive.
      - name: Refuse anything except a GitHub-hosted Windows x64 runner
        if: runner.environment != 'github-hosted' || runner.os != 'Windows' || runner.arch != 'X64'
        run: throw 'Native installer acceptance requires a disposable GitHub-hosted Windows x64 VM.'

      - name: Check out only the installer source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, as in ci/regression-tests.yml
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: '/windows/installer/'
          sparse-checkout-cone-mode: false

      - name: Verify silent CLI lifecycle and real-stub migration with synthetic data
        working-directory: windows/installer
        run: |
          $ErrorActionPreference = 'Stop'
          $go = (Get-Command go.exe -CommandType Application -ErrorAction Stop).Path
          $root = Join-Path $env:RUNNER_TEMP ('installer-' + [IO.Path]::GetRandomFileName())
          $null = New-Item -ItemType Directory -Path $root
          $userHome = Join-Path $root 'profile'
          $dirs = @{
            TMP = "$root\tmp"; TEMP = "$root\tmp"; TMPDIR = "$root\tmp"
            USERPROFILE = $userHome; HOME = $userHome
            APPDATA = "$userHome\AppData\Roaming"; LOCALAPPDATA = "$userHome\AppData\Local"
            GOTMPDIR = "$root\go-tmp"; GOCACHE = "$root\go-build"
            GOPATH = "$root\go"; GOMODCACHE = "$root\go\pkg\mod"
          }
          foreach ($path in $dirs.Values) { $null = [IO.Directory]::CreateDirectory($path) }

          # The Go process, nested stub build and uninstall worker inherit only this environment.
          $system32 = [Environment]::SystemDirectory
          $winPS = "$system32\WindowsPowerShell\v1.0"
          $drive = [IO.Path]::GetPathRoot($userHome).TrimEnd('\')
          $childEnv = $dirs + @{
            HOMEDRIVE = $drive; HOMEPATH = $userHome.Substring($drive.Length)
            SystemRoot = $env:SystemRoot; WINDIR = $env:SystemRoot; ComSpec = "$system32\cmd.exe"
            PATH = "$([IO.Path]::GetDirectoryName($go));$system32;$winPS"; PATHEXT = '.COM;.EXE;.BAT;.CMD'
            PSModulePath = "$winPS\Modules"
            GOENV = 'off'; GOWORK = 'off'; GOTOOLCHAIN = 'local'; CGO_ENABLED = '0'
            GOPROXY = 'off'; GOSUMDB = 'off'; GOVCS = '*:off'; GOAUTH = 'off'
            PROKBOT_INSTALLER_DISPOSABLE_WINDOWS = '1'
          }
          $info = [Diagnostics.ProcessStartInfo]::new($go)
          $info.WorkingDirectory = $PWD.Path
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.Environment.Clear()
          foreach ($item in $childEnv.GetEnumerator()) { $info.Environment[$item.Key] = $item.Value }
          function Invoke-FixtureGo([string[]]$GoArgs) {
            $info.ArgumentList.Clear()
            foreach ($arg in $GoArgs) { $info.ArgumentList.Add($arg) }
            $p = [Diagnostics.Process]::Start($info)
            try {
              $output = $p.StandardOutput.ReadToEnd()
              $p.WaitForExit()
              [pscustomobject]@{ Code = $p.ExitCode; Text = $output }
            } finally { $p.Dispose() }
          }

          $version = Invoke-FixtureGo @('version')
          if ($version.Code -ne 0) { throw 'Could not identify the preinstalled Go toolchain.' }
          Write-Host ('Image {0}; {1}' -f $env:ImageVersion, $version.Text.Trim())
          if ((Invoke-FixtureGo @('telemetry', 'off')).Code -ne 0) { throw 'Could not disable Go telemetry in the fixture profile.' }

          # The first CLI uses fixture shell hooks; the second builds the unmocked GUI stub.
          # Both payloads are generated by the tests. No official client or candidate setup is used.
          $tests = @('TestNativeCLISilentInstallUpgradeAndWorkerUninstall', 'TestNativeStubLegacyMigrationFromInstallDirectory')
          $pattern = '^(' + ($tests -join '|') + ')$'
          $result = Invoke-FixtureGo @('test', '-json', '-count=1', '-parallel=1', '-timeout=5m', '-buildvcs=false', '-mod=readonly', '-run', $pattern, '.')

          $pkg = 'grokbot.local/installer'
          $trace = @{ $pkg = @() }
          foreach ($name in $tests) { $trace[$name] = @() }
          foreach ($line in ($result.Text -split '\r?\n')) {
            if (!$line) { continue }
            $event = ConvertFrom-Json -InputObject $line -ErrorAction Stop
            if ($result.Code -ne 0 -and $event.Output) { Write-Host ('go: ' + $event.Output.TrimEnd()) }
            if ($event.Action -clike 'build-*' -or $event.Action -ceq 'output') { continue }
            if ($event.Package -cne $pkg) { throw "Unexpected Go test package: $($event.Package)" }
            $name = $pkg
            if ($event.Test) {
              $name = $event.Test
              if ($name -cnotin $tests) { throw "Unexpected Go test: $name" }
            }
            $trace[$name] += $event.Action
          }
          $ok = $result.Code -eq 0 -and ($trace[$pkg] -join ',') -ceq 'start,pass'
          foreach ($name in $tests) {
            $sequence = $trace[$name] -join ','
            Write-Host ("{0}: [{1}]" -f $name, $sequence)
            if ($sequence -cne 'run,pass') { $ok = $false }
          }
          if (!$ok) { throw "Native acceptance failed (go exit $($result.Code); package [$($trace[$pkg] -join ',')]); each named test must run and pass exactly once." }
